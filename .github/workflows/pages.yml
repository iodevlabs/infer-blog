name: Build and deploy blog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  PUBLIC_DIR: public
  CONTENT_DIR: content/blog
  CACHE_DIR: .cache

  BLOG_CNAME: ${{ vars.BLOG_CNAME || 'blog.inferorigins.com' }}
  BLOG_BASE_URL: ${{ vars.BLOG_BASE_URL || 'https://blog.inferorigins.com' }}
  MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL || 'https://www.inferorigins.com' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infer-blog

    steps:
      - name: Checkout infer-blog
        uses: actions/checkout@v4
        with:
          path: infer-blog

      - name: Checkout infer-utils
        uses: actions/checkout@v4
        with:
          repository: iodevlabs/infer-utils
          path: infer-utils
          token: ${{ secrets.GH_REPO_READ_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: infer-blog/go.mod
          cache: true
          cache-dependency-path: |
            infer-blog/go.sum
            infer-utils/go.sum

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify shared module
        run: |
          test -f ../infer-utils/go.mod
          go list -m inferorigins.com/infer-utils

      - name: Check dependencies
        run: make check-deps

      - name: Build blog
        run: make build

      - name: Create Pages root
        run: |
          mkdir -p "$PUBLIC_DIR"

          cat > "$PUBLIC_DIR/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Infer Origins Blog Content</title>
          </head>
          <body>
            <p>Infer Origins blog content service.</p>
          </body>
          </html>
          EOF

      - name: Disable Jekyll
        run: touch "$PUBLIC_DIR/.nojekyll"

      - name: Verify build output
        run: |
          echo "Generated files:"
          find "$PUBLIC_DIR" -maxdepth 5 -type f | sort

          test -f "$PUBLIC_DIR/index.html"
          test -f "$PUBLIC_DIR/index.json"
          test -f "$PUBLIC_DIR/blog/index.json"
          test -f "$PUBLIC_DIR/CNAME"
          test -f "$PUBLIC_DIR/.nojekyll"

          echo "CNAME:"
          cat "$PUBLIC_DIR/CNAME"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./infer-blog/public

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
